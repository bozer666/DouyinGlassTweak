name: Build DouyinGlass

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install ldid
        run: brew install ldid

      - name: Build package
        run: make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: List output
        run: |
          find packages -maxdepth 1 -type f -print
          find .theos/obj -name 'DouyinGlass.dylib' -print

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouyinGlass
          path: |
            packages/*.deb
            .theos/obj/**/DouyinGlass.dylib
          include-hidden-files: true
          if-no-files-found: error
